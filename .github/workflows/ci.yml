name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check painscout tests

      - name: Unit tests
        run: pytest -m "not e2e" -q --cov=painscout --cov-report=term-missing
